{
    "Dhcp4": {
        // Network interfaces to listen on.
        "interfaces-config": {
            "interfaces": [ "ens3" ]
        },

        // Unix domain socket that receives commands formatted in JSON, e.g. config-set (which sets new
        "control-socket": {
            "socket-type": "unix",
            "socket-name": "/tmp/kea-dhcp4-ctrl.sock"
        },

        // Memfile lease database backend to store leases in a CSV file.
        "lease-database": {
            // Memfile is the simplest and easiest backend to use. It's a in-memory
            // C++ database that stores its state in CSV file.
            "type": "memfile",
            "lfc-interval": 3600
        },

        // Subnet declarations with their pool of addresses and default gateways
        "subnet4": [

            // VLAN 10 subnet
            {
                "subnet": "10.10.10.0/24",
                "pools": [ { "pool": "10.10.10.15 - 10.10.10.250" } ],
                // Default Gateway
                "option-data": [
                    {
                        "name": "routers",
                        "data": "10.10.10.5"
                    }
                ]
            },

            // VLAN 20 subnet
            {
                "subnet": "10.10.20.0/24",
                "pools": [ { "pool": "10.10.20.15 - 10.10.20.250" } ],
                // Default Gateway
                "option-data": [
                    {
                        "name": "routers",
                        "data": "10.10.20.5"
                    }
                ]
            },

            // VLAN 30 subnet
            {
                "subnet": "10.10.30.0/24",
                "pools": [ { "pool": "10.10.30.15 - 10.10.30.250" } ],
                // Default Gateway
                "option-data": [
                    {
                        "name": "routers",
                        "data": "10.10.30.5"
                    }
                ]
            }
        ]
    }
}